# backup

upstream context-search {
        server unix:/home/ubuntu/proj/ContextAPI/run/gunicorn.sock fail_timeout=0;
}
server {
    listen 443 ssl http2;
    server_name lightwaves.pl www.lightwaves.pl;
    ssl_certificate /etc/letsencrypt/live/lightwaves.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lightwaves.pl/privkey.pem;
    ssl_protocols TLSv1.2;

    keepalive_timeout 5;
    client_max_body_size 4G;

    access_log /home/ubuntu/proj/ContextAPI/logs/nginx-access.log;
    error_log /home/ubuntu/proj/ContextAPI/logs/nginx-error.log;

    root /home/ubuntu/proj/ContextAPI;

    location / {
        return 301 /home/;
    }

    location /home/ {
        root /home/ubuntu/proj/ContextAPI/static;
        index index.html;
    }

    location /v1/api {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        if (!-f $request_filename) {
            proxy_pass http://context-search;
            break;
        }
    }
}
